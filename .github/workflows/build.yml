name: Cloud APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Installs Gradle 9.3.1 (matches gradle-wrapper.properties and AGP 9.1.1).
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # The zip does not include gradle-wrapper.jar, so generate the wrapper
      # (gradlew + jar) using the same version the project expects.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # Firebase needs app/google-services.json. The AI Studio export stores it
      # under public/assets with a hash suffix, so copy it into place.
      - name: Copy google-services.json
        run: |
          SRC=$(find public -name 'google-services*.json' | head -n 1)
          if [ -n "$SRC" ]; then
            cp "$SRC" app/google-services.json
            echo "Copied $SRC to app/google-services.json"
          else
            echo "No google-services.json found; Firebase will not be configured."
          fi

      # build.gradle.kts signs debug builds with debug.keystore in the project root.
      # That file is git-ignored, so create it here (same values Android Studio uses).
      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Horti-Waste-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
